version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker/security
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker/go-test-runner
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker/wails3-builder
    schedule:
      interval: weekly
