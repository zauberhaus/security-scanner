name: Build security-scanner image

on:
  # Images are built only when a release is created; the release tag becomes
  # the image version. Created by release-please with an App token, so the
  # event does start this workflow.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-security-scanner-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/security-scanner
  DOCKERFILE: docker/security/Dockerfile
  TOOLS_ENV: scripts/security-tools.env

jobs:
  runners:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      linux_amd64: ${{ steps.pick.outputs.linux_amd64 }}
      linux_arm64: ${{ steps.pick.outputs.linux_arm64 }}
    steps:
      - uses: actions/checkout@v7

      # A self-hosted runner when an idle one is online, else the hosted one.
      # Set the repository variable USE_SELF_HOSTED to false to force hosted.
      - name: Pick
        id: pick
        uses: ./.github/actions/choose-runners
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          use-self-hosted: ${{ vars.USE_SELF_HOSTED }}

  # Each architecture is built natively on its own runner (no QEMU) and pushed
  # by digest; the merge job combines the digests into one multi-arch tag.
  build:
    needs: runners
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            pair: linux-amd64
            runner: ${{ needs.runners.outputs.linux_amd64 }}
          - platform: linux/arm64
            pair: linux-arm64
            runner: ${{ needs.runners.outputs.linux_arm64 }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read tool versions
        id: tools
        run: |
          {
            echo 'args<<EOF'
            grep -E '^[A-Z_]+=' "$TOOLS_ENV"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.tools.outputs.args }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # The cache lives in ghcr.io, not in the GitHub Actions cache: images
          # are built on release tags, and a cache written on a tag cannot be
          # read by the next one, so it only filled the 10 GB limit.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.pair }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.pair }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Describe tools
        id: tools
        run: |
          . "$TOOLS_ENV"
          # Shown as the package description on ghcr.io.
          echo "description=Go with govulncheck $GOVULNCHECK_VERSION, gosec $GOSEC_VERSION, gitleaks $GITLEAKS_VERSION and golangci $GOLANGCI_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # ghcr.io reads the package description from the index annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=security-scanner
            org.opencontainers.image.description=${{ steps.tools.outputs.description }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r t; do args+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r a; do args+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for d in *; do args+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
