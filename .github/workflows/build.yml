name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - docker/security/**
      - scripts/security-tools.env
      - .github/workflows/build.yml
  pull_request:
    paths:
      - docker/security/**
      - scripts/security-tools.env
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/security-scanner
  DOCKERFILE: docker/security/Dockerfile
  TOOLS_ENV: scripts/security-tools.env

jobs:
  # Each architecture is built natively on its own runner (no QEMU) and pushed
  # by digest; the merge job combines the digests into one multi-arch tag.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read tool versions
        id: tools
        run: |
          {
            echo 'args<<EOF'
            grep -E '^[A-Z_]+=' "$TOOLS_ENV"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Platform pair
        run: echo "PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.tools.outputs.args }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ env.PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PAIR }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Describe tools
        id: tools
        run: |
          . "$TOOLS_ENV"
          # Shown as the package description on ghcr.io.
          echo "description=Go with govulncheck $GOVULNCHECK_VERSION, gosec $GOSEC_VERSION and gitleaks $GITLEAKS_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # ghcr.io reads the package description from the index annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=security-scanner
            org.opencontainers.image.description=${{ steps.tools.outputs.description }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r t; do args+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r a; do args+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for d in *; do args+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
