name: Build test image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - docker/test/**
      - scripts/test-tools.env
      - .github/workflows/build-test.yml
  pull_request:
    paths:
      - docker/test/**
      - scripts/test-tools.env
      - .github/workflows/build-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/security-scanner-test

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read tool versions
        id: tools
        run: |
          {
            echo 'args<<EOF'
            grep -E '^[A-Z_]+=' scripts/test-tools.env
            echo EOF
          } >> "$GITHUB_OUTPUT"
          . scripts/test-tools.env
          echo "description=Go test image with GTK, WebKit, Playwright $PLAYWRIGHT_VERSION (Chromium), gocover-cobertura $GOCOVER_COBERTURA_VERSION and gotestfmt $GOTESTFMT_VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=security-scanner-test
            org.opencontainers.image.description=${{ steps.tools.outputs.description }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/test/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ steps.tools.outputs.args }}
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test
