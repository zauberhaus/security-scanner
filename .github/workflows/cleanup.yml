name: Clean up packages

# Deletes old container image versions, keeping the latest release and the one
# before (scripts/cleanup-packages.sh), and Actions caches that were not used
# for two days (scripts/cleanup-caches.sh).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reading the manifests of the kept versions needs a registry login.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old versions
        run: scripts/cleanup-packages.sh ${{ inputs.dry_run && '-n' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  caches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Delete old caches
        run: scripts/cleanup-caches.sh ${{ inputs.dry_run && '-n' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
