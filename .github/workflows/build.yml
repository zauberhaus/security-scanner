name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - docker/security/**
      - scripts/security-tools.env
      - .github/workflows/build.yml
  pull_request:
    paths:
      - docker/security/**
      - scripts/security-tools.env
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/security-scanner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:         
          - variant: debian
            dockerfile: docker/security/Dockerfile
            suffix: ""
            runner: ubuntu-26.04
            arch: amd64
          - variant: debian
            dockerfile: docker/security/Dockerfile
            suffix: ""
            runner: ubuntu-26.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Read tool versions
        id: tools
        run: |
          {
            echo 'args<<EOF'
            grep -E '^[A-Z_]+=' scripts/security-tools.env
            echo EOF
          } >> "$GITHUB_OUTPUT"
          # Shown as the package description on ghcr.io.
          . scripts/security-tools.env
          echo "description=Go with govulncheck $GOVULNCHECK_VERSION, gosec $GOSEC_VERSION and gitleaks $GITLEAKS_VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # ghcr.io reads the package description from the index of a
          # multi-platform image, so annotate it as well as the manifests.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=security-scanner
            org.opencontainers.image.description=${{ steps.tools.outputs.description }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ steps.tools.outputs.args }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
